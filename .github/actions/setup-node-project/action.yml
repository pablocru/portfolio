name: "Setup Node Project"
description: "Install Node.js, pnpm and project dependencies, and check the runtime"
author: "Pablo Cru Delhom (pablocru)"

runs:
  using: "composite"

  steps:
    - name: "Setup Node.js and pnpm with cache"
      uses: "pnpm/setup@v3"
      with:
        require-lockfile: true
        cache: true

    - name: "Check the Node runtime for known vulnerabilities"
      run: "pnpm dlx is-my-node-vulnerable@1.6.1"
