name: Quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@v3
        with:
          require-lockfile: true
          cache: true

      - name: Lint and format with Biome
        run: pnpm biome ci .

      - name: Check YAML formatting with Prettier
        run: pnpm prettier --check "**/*.{yml,yaml}"

      - name: Check Markdown with rumdl
        run: pnpm rumdl check .

      - name: Type check with Astro
        run: pnpm astro check
