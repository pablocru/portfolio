name: Quality gate

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: "Setup Node Project"
        uses: "./.github/actions/setup-node-project"

      - name: Lint and format with Biome
        run: pnpm biome ci .

      - name: Check YAML formatting with Prettier
        run: pnpm prettier --check "**/*.{yml,yaml}"

      - name: Check Markdown with rumdl
        run: pnpm rumdl check .

      - name: Type check with Astro
        run: pnpm astro check

      - name: Test with Vitest
        run: pnpm test
